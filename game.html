<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KANJI VS ZOMBIE - Luyện Đọc & Gõ N5</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kanji vs Zombie">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#064e3b">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #070b14;
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(16, 185, 129, 0.16), transparent 60%),
                radial-gradient(rgba(34, 197, 94, 0.1) 1px, transparent 1px);
            background-size: 100% 100%, 24px 24px;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            margin: 0;
            padding: calc(10px + env(safe-area-inset-top)) 12px calc(14px + env(safe-area-inset-bottom)) 12px;
        }

        .game-container {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.96) 0%, rgba(17, 24, 39, 0.98) 100%);
            border: 3px solid #10b981;
            border-radius: 22px;
            padding: 14px;
            width: 100%;
            max-width: 680px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 25px rgba(16, 185, 129, 0.22);
            position: relative;
            overflow: hidden;
        }

        /* Thanh điều hướng trên cùng */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.35);
            color: #e2e8f0;
            text-decoration: none;
            padding: 6px 11px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-back:hover { background: #334155; color: #fff; }

        .level-select-wrap {
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            border: 1.5px solid #60a5fa;
            border-radius: 10px;
            padding: 2px 6px;
            min-width: 0;
        }

        .level-select {
            background: transparent;
            color: #fff;
            border: none;
            font-size: 12.5px;
            font-weight: 800;
            padding: 4px 2px;
            outline: none;
            cursor: pointer;
            max-width: 185px;
        }
        .level-select option {
            background: #1e293b;
            color: #fff;
        }

        .btn-sound {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(148, 163, 184, 0.35);
            color: #fbbf24;
            width: 34px;
            height: 32px;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Thanh trạng thái điểm & thời gian */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 7px 12px;
            border-radius: 12px;
            margin-bottom: 10px;
            font-size: 13px;
            font-weight: 700;
        }

        .stat-pill {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.35);
            padding: 4px 9px;
            border-radius: 8px;
        }

        .timer-box {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 15px;
            font-weight: 900;
            color: #fbbf24;
        }
        .timer-num {
            display: inline-block;
            min-width: 22px;
            font-size: 19px;
        }
        .timer-box.crit-mode {
            color: #ef4444;
            animation: timerPulse 0.45s infinite alternate;
        }
        @keyframes timerPulse {
            from { transform: scale(1); text-shadow: 0 0 6px rgba(239, 68, 68, 0.5); }
            to { transform: scale(1.16); text-shadow: 0 0 14px rgba(239, 68, 68, 0.95); }
        }

        /* Sân đấu Bãi Cỏ Đêm */
        .battle-field {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            height: 185px;
            background: linear-gradient(180deg, #091326 0%, #112a46 48%, #15803d 49%, #166534 75%, #14532d 100%);
            border: 2px solid rgba(74, 222, 128, 0.25);
            border-bottom: 7px solid #052e16;
            padding: 0 16px 8px 16px;
            margin-bottom: 12px;
            position: relative;
            border-radius: 16px;
            box-shadow: inset 0 10px 25px rgba(0, 0, 0, 0.65);
            overflow: hidden;
        }

        .arena-moon {
            position: absolute;
            top: 12px;
            right: 24px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fef9c3, #fde047);
            box-shadow: 0 0 18px rgba(253, 224, 71, 0.55);
            opacity: 0.85;
            pointer-events: none;
        }

        .lawn-stripes {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 51%;
            background-image: repeating-linear-gradient(
                90deg,
                rgba(255, 255, 255, 0.04) 0px,
                rgba(255, 255, 255, 0.04) 48px,
                transparent 48px,
                transparent 96px
            );
            pointer-events: none;
        }

        .character-box {
            width: 96px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 3;
        }

        .svg-char {
            width: 88px;
            height: 96px;
            filter: drop-shadow(0 6px 6px rgba(0, 0, 0, 0.6));
        }

        .peashooter-wrap {
            animation: peaIdle 1.8s ease-in-out infinite;
            transform-origin: bottom center;
        }
        .peashooter-wrap.shoot {
            animation: peaRecoil 0.22s ease-out;
        }
        @keyframes peaIdle {
            0%, 100% { transform: scaleY(1) rotate(0deg); }
            50% { transform: scaleY(1.04) rotate(2deg); }
        }
        @keyframes peaRecoil {
            0% { transform: translateX(-8px) scaleX(0.92) rotate(-6deg); }
            60% { transform: translateX(4px) scaleX(1.05) rotate(3deg); }
            100% { transform: translateX(0) scaleX(1) rotate(0deg); }
        }

        .zombie-box { transition: transform 0.12s ease; }
        .zombie-svg-wrap {
            animation: zombieWalk 2.2s ease-in-out infinite;
            transform-origin: bottom center;
        }
        @keyframes zombieWalk {
            0%, 100% { transform: rotate(-2deg) translateY(0); }
            50% { transform: rotate(2.5deg) translateY(-2px); }
        }
        .zombie-box.hit {
            transform: translateX(14px) rotate(9deg);
            filter: brightness(1.9) drop-shadow(0 0 12px #ef4444);
        }

        .zombie-tag {
            font-size: 9.5px;
            font-weight: 900;
            color: #fecaca;
            background: rgba(127, 29, 29, 0.9);
            padding: 2px 7px;
            border-radius: 6px;
            margin-bottom: 3px;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }
        .hp-bar-bg {
            width: 88px;
            height: 10px;
            background: #1f2937;
            border-radius: 99px;
            overflow: hidden;
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            margin-bottom: 3px;
        }
        .hp-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #dc2626, #f87171);
            transition: width 0.22s ease-out;
        }

        /* Đạn bắn & Hiệu ứng nổ */
        .peashot {
            position: absolute;
            width: 22px;
            height: 22px;
            background: radial-gradient(circle at 35% 35%, #fef9c3, #4ade80 55%, #15803d);
            border-radius: 50%;
            border: 2px solid #dcfce7;
            bottom: 52px;
            left: 88px;
            z-index: 6;
            box-shadow: 0 0 12px #4ade80, -10px 0 14px rgba(74, 222, 128, 0.6);
        }
        .peashot.crit {
            width: 30px;
            height: 30px;
            bottom: 48px;
            background: radial-gradient(circle at 35% 35%, #fef08a, #f97316 55%, #dc2626);
            border-color: #fef08a;
            box-shadow: 0 0 18px #f59e0b, -14px 0 20px rgba(239, 68, 68, 0.8);
        }

        .dmg-float {
            position: absolute;
            right: 40px;
            bottom: 105px;
            font-size: 19px;
            font-weight: 900;
            color: #fde047;
            text-shadow: 0 2px 0 #000, 0 0 10px rgba(234, 179, 8, 0.8);
            pointer-events: none;
            z-index: 12;
            animation: floatDamage 0.75s ease-out forwards;
        }
        .dmg-float.crit {
            font-size: 22px;
            color: #ff4d4d;
            text-shadow: 0 2px 0 #000, 0 0 14px #f59e0b;
        }
        @keyframes floatDamage {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            30% { opacity: 1; transform: translateY(-14px) scale(1.15); }
            100% { opacity: 0; transform: translateY(-38px) scale(0.95); }
        }

        .hit-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
            animation: particleBurst 0.45s ease-out forwards;
        }
        @keyframes particleBurst {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2); }
        }

        /* Thẻ hiển thị câu hỏi Kanji */
        .question-box {
            background: linear-gradient(180deg, #ffffff 0%, #f1f5f9 100%);
            color: #0f172a;
            border-radius: 16px;
            padding: 12px 14px 14px 14px;
            margin-bottom: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.45), inset 0 2px 0 #fff;
            border: 3px solid #cbd5e1;
            position: relative;
            overflow: hidden;
        }

        .time-progress-track {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: #e2e8f0;
        }
        .time-progress-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, #10b981, #34d399);
            transition: width 1s linear, background 0.3s ease;
        }
        .time-progress-bar.warn { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        .time-progress-bar.danger { background: linear-gradient(90deg, #dc2626, #ef4444); }

        .kanji-grid-bg {
            position: relative;
            display: inline-block;
            padding: 4px 20px;
            margin-top: 4px;
            border: 1.5px dashed rgba(148, 163, 184, 0.55);
            border-radius: 12px;
            background-image: 
                linear-gradient(to right, transparent 49.5%, rgba(148, 163, 184, 0.25) 50%, transparent 50.5%),
                linear-gradient(to bottom, transparent 49.5%, rgba(148, 163, 184, 0.25) 50%, transparent 50.5%);
        }

        .kanji-text {
            font-size: 52px;
            font-weight: 900;
            line-height: 1.12;
            color: #0f172a;
            font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
            letter-spacing: 2px;
        }

        .progress-text {
            font-size: 12px;
            color: #475569;
            margin-top: 6px;
            font-weight: 700;
        }

        .combo-badge {
            position: absolute;
            top: 12px;
            right: 10px;
            background: linear-gradient(135deg, #f59e0b, #ea580c);
            color: #fff;
            padding: 3px 9px;
            font-size: 11px;
            font-weight: 900;
            border-radius: 99px;
            box-shadow: 0 3px 8px rgba(234, 88, 12, 0.45);
            display: none;
        }

        /* Khu vực nhập đáp án (Cỡ chữ 16px chống auto-zoom trên iPhone & không bị cắt chữ) */
        .input-group {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            min-width: 0;
            padding: 12px 10px;
            font-size: 16px;
            border-radius: 12px;
            border: 3px solid #3b82f6;
            outline: none;
            text-align: center;
            font-weight: 800;
            background: #f8fafc;
            color: #0f172a;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input[type="text"]::placeholder {
            font-size: 14.5px;
            font-weight: 700;
            color: #94a3b8;
        }
        input[type="text"]:focus {
            border-color: #10b981;
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
        }
        input[type="text"].shake {
            animation: inputShake 0.32s ease;
            border-color: #ef4444 !important;
            background: #fef2f2;
        }
        @keyframes inputShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            50% { transform: translateX(8px); }
            75% { transform: translateX(-5px); }
        }

        .btn-submit {
            background: linear-gradient(180deg, #22c55e 0%, #16a34a 100%);
            color: #fff;
            border: none;
            border-bottom: 4px solid #14532d;
            padding: 0 18px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            letter-spacing: 0.4px;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn-submit:active {
            transform: translateY(3px);
            border-bottom-width: 1px;
        }

        .crit-banner {
            display: none;
            position: absolute;
            top: 52px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(90deg, #dc2626, #ea580c);
            color: #fff;
            padding: 4px 14px;
            font-size: 11.5px;
            font-weight: 900;
            border-radius: 99px;
            border: 1.5px solid #fde047;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.75);
            z-index: 15;
            white-space: nowrap;
            animation: critBounce 0.5s infinite alternate;
        }
        @keyframes critBounce {
            from { transform: translateX(-50%) scale(1); }
            to { transform: translateX(-50%) scale(1.07); }
        }

        .levelup-toast {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(6, 78, 59, 0.96), rgba(30, 27, 75, 0.96));
            border: 2.5px solid #fbbf24;
            border-radius: 20px;
            padding: 20px 24px;
            z-index: 25;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9);
            text-align: center;
            width: 85%;
            max-width: 340px;
        }

        .overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(9, 13, 22, 0.94);
            backdrop-filter: blur(8px);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            padding: 20px;
        }
        .overlay h2 {
            font-size: 32px;
            font-weight: 900;
            margin: 0 0 12px 0;
            color: #ef4444;
        }
        .overlay h2.win { color: #22c55e; }

        .ans-reveal-card {
            background: rgba(30, 41, 59, 0.85);
            border: 1.5px solid rgba(251, 191, 36, 0.45);
            border-radius: 16px;
            padding: 12px 20px;
            margin-bottom: 12px;
            width: 100%;
            max-width: 300px;
        }
        .ans-kanji-big { font-size: 40px; font-weight: 900; color: #fff; line-height: 1.15; }
        .ans-reading { font-size: 17px; font-weight: 800; color: #fbbf24; margin-top: 4px; }

        .overlay-actions { display: flex; gap: 10px; margin-top: 14px; }
        .btn-restart {
            background: linear-gradient(180deg, #3b82f6, #1d4ed8);
            color: #fff;
            border: none;
            border-bottom: 4px solid #1e3a8a;
            padding: 11px 22px;
            font-size: 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
        }
        .btn-menu-end {
            background: rgba(51, 65, 85, 0.9);
            color: #e2e8f0;
            text-decoration: none;
            border: 1px solid rgba(148, 163, 184, 0.4);
            padding: 11px 18px;
            font-size: 15px;
            border-radius: 12px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
        }

        @media (max-width: 480px) {
            .battle-field { height: 165px; padding: 0 12px 6px 12px; }
            .svg-char { width: 78px; height: 86px; }
            .character-box { width: 84px; }
            .kanji-text { font-size: 46px; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="crit-banner" id="crit-banner">🔥 CRIT DAME X2 (3S CUỐI) 🔥</div>

    <div class="top-nav">
        <a href="index.html" onclick="goPage('index.html'); return false;" class="btn-back">← Menu</a>
        <div class="level-select-wrap">
            <select id="level-select" class="level-select" onchange="jumpToLevel(this.value)" title="Chọn bài Kanji"></select>
        </div>
        <button class="btn-sound" id="btn-sound" onclick="toggleSound()" title="Bật/Tắt âm thanh">🔊</button>
    </div>

    <div class="status-bar">
        <div class="timer-box" id="timer-box">⏳ <span class="timer-num" id="timer">10</span>s</div>
        <div class="stat-pill">💀 Diệt: <span id="kills" style="color:#4ade80;">0</span></div>
        <div class="stat-pill">🏆 Kỷ lục: <span id="high-score" style="color:#fbbf24;">0</span></div>
    </div>

    <div class="battle-field" id="arena">
        <div class="arena-moon"></div>
        <div class="lawn-stripes"></div>

        <div class="character-box">
            <div class="peashooter-wrap" id="peashooter-wrap">
                <svg class="svg-char" viewBox="0 0 100 100">
                    <path d="M 50 65 Q 32 76 16 86 Q 42 84 50 65 Z" fill="#15803d" stroke="#052e16" stroke-width="1.5"/>
                    <path d="M 50 65 Q 68 76 84 86 Q 58 84 50 65 Z" fill="#15803d" stroke="#052e16" stroke-width="1.5"/>
                    <path d="M 46 45 C 44 62 54 75 50 92" stroke="#16a34a" stroke-width="8" fill="none" stroke-linecap="round"/>
                    <path d="M 22 30 Q 8 20 14 38 Q 20 40 24 34 Z" fill="#16a34a" stroke="#052e16" stroke-width="1.5"/>
                    <circle cx="40" cy="38" r="22" fill="#22c55e" stroke="#052e16" stroke-width="2"/>
                    <ellipse cx="62" cy="38" rx="13" ry="15" fill="#16a34a" stroke="#052e16" stroke-width="2"/>
                    <ellipse cx="64" cy="38" rx="7.5" ry="10.5" fill="#052e16"/>
                    <circle cx="37" cy="30" r="5" fill="#090d16"/>
                    <circle cx="38.5" cy="28.5" r="2" fill="#fff"/>
                </svg>
            </div>
        </div>

        <div class="character-box zombie-box" id="zombie-box">
            <div class="zombie-tag" id="zombie-rank">ZOMBIE N5</div>
            <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp-bar"></div></div>
            <div class="zombie-svg-wrap">
                <svg class="svg-char" viewBox="0 0 100 100">
                    <rect x="35" y="46" width="30" height="34" fill="#1e3a8a" rx="4" stroke="#0f172a" stroke-width="1.5"/>
                    <polygon points="48,47 52,47 53,63 50,67 47,63" fill="#dc2626"/>
                    <rect x="38" y="78" width="10" height="19" fill="#451a03"/>
                    <rect x="52" y="78" width="10" height="19" fill="#451a03"/>
                    <path d="M 35 52 L 14 54 L 9 60" stroke="#6b7280" stroke-width="6" stroke-linecap="round" fill="none"/>
                    <rect x="30" y="16" width="40" height="32" fill="#6b7280" rx="8" stroke="#1f2937" stroke-width="1.5"/>
                    <g id="zombie-armor-cone" style="display:none;">
                        <polygon points="34,18 50,0 66,18" fill="#f97316" stroke="#7c2d12" stroke-width="1.5"/>
                        <rect x="31" y="15" width="38" height="4" rx="2" fill="#ea580c"/>
                    </g>
                    <g id="zombie-armor-bucket" style="display:none;">
                        <path d="M 33 18 L 37 2 L 63 2 L 67 18 Z" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
                        <line x1="34" y1="8" x2="66" y2="8" stroke="#475569" stroke-width="2"/>
                    </g>
                    <circle cx="42" cy="27" r="5.5" fill="#fff" stroke="#000" stroke-width="1"/>
                    <circle cx="41" cy="27" r="2" fill="#000"/>
                    <circle cx="58" cy="29" r="7.5" fill="#fff" stroke="#000" stroke-width="1"/>
                    <circle cx="56" cy="29" r="2.5" fill="#ef4444"/>
                    <path d="M 40 39 Q 50 44 60 39" stroke="#111827" stroke-width="2.2" fill="none"/>
                </svg>
            </div>
        </div>
    </div>

    <div class="question-box">
        <div class="time-progress-track">
            <div class="time-progress-bar" id="time-progress-bar"></div>
        </div>
        <div class="combo-badge" id="combo-badge">COMBO x2</div>
        <div class="kanji-grid-bg">
            <div class="kanji-text" id="kanji-display">-</div>
        </div>
        <div class="progress-text" id="progress-display">Tiến độ bài: 0/0</div>
    </div>

    <div class="input-group">
        <input type="text" id="type-input" placeholder="Gõ Hiragana / Romaji..." autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" enterkeyhint="go">
        <button class="btn-submit" onclick="submitAnswer()">BẮN ➔</button>
    </div>

    <div class="levelup-toast" id="levelup-toast">
        <div style="font-size: 32px; margin-bottom: 6px;">🎉🔥</div>
        <div style="font-size: 18px; font-weight: 900; color: #fde047;" id="levelup-title">HOÀN THÀNH BÀI 1!</div>

    for (let lvl in n5LevelsData) {
        n5LevelsData[lvl].forEach(item => {
            item.romaji = item.romaji.replace(/\s+/g, '');
            item.hira = item.hira.replace(/\s+/g, '');
        });
    }

    let currentLevel = 1;
    let levelQueue = [];
    let currentQuestionIndex = 0;

    let timeLeft = 10;
    let kills = 0;
    let highScore = parseInt(localStorage.getItem('kanji_zombie_best') || '0', 10);
    let combo = 0;
    let currentZombieHP = 100;
    let maxZombieHP = 100;

    let timerInterval = null;
    let isCritMode = false;
    let isShooting = false;
    let soundEnabled = true;

    let audioCtx = null;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function toggleSound() {
        soundEnabled = !soundEnabled;
        document.getElementById('btn-sound').innerText = soundEnabled ? '🔊' : '🔇';
    }

    function playSound(type) {
        if (!soundEnabled) return;
        try {
            initAudio();
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (type === 'shoot') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(110, now + 0.14);
                gain.gain.setValueAtTime(0.22, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.14);
                osc.start(now);
                osc.stop(now + 0.14);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(isCritMode ? 180 : 130, now);
                osc.frequency.linearRampToValueAtTime(45, now + 0.12);
                gain.gain.setValueAtTime(isCritMode ? 0.35 : 0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'levelup') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                osc.start(now);
                osc.stop(now + 0.4);
            } else if (type === 'gameover') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(210, now);
                osc.frequency.linearRampToValueAtTime(75, now + 0.5);
                gain.gain.setValueAtTime(0.35, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            }
        } catch (e) {}
    }

    function initLevelSelect() {
        const sel = document.getElementById('level-select');
        const maxLvl = Object.keys(n5LevelsData).length;
        for (let i = 1; i <= maxLvl; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.innerText = `📘 BÀI ${i} (${n5LevelsData[i].length} từ)`;
            sel.appendChild(opt);
        }
        const infOpt = document.createElement('option');
        infOpt.value = maxLvl + 1;
        infOpt.innerText = `🔥 VÔ TẬN (160+ từ)`;
        sel.appendChild(infOpt);
    }

    function jumpToLevel(lvlVal) {
        clearInterval(timerInterval);
        isShooting = false;
        loadLevel(parseInt(lvlVal, 10));
    }

    const inputField = document.getElementById('type-input');

    inputField.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') submitAnswer();
    });

    window.onload = function () {
        initLevelSelect();
        startGame();
    };

    function startGame() {
        kills = 0;
        combo = 0;
        currentLevel = 1;
        currentZombieHP = 100;
        updateZombieAppearance();
        document.getElementById('kills').innerText = kills;
        document.getElementById('combo-badge').style.display = 'none';
        document.getElementById('end-screen').style.display = 'none';
        document.getElementById('hp-bar').style.width = '100%';
        loadLevel(currentLevel);
    }

    function loadLevel(lvl) {
        currentLevel = lvl;
        const maxDefinedLevel = Object.keys(n5LevelsData).length;
        const sel = document.getElementById('level-select');

        if (currentLevel <= maxDefinedLevel) {
            sel.value = currentLevel;
            levelQueue = [...n5LevelsData[currentLevel]].sort(() => Math.random() - 0.5);
        } else {
            sel.value = maxDefinedLevel + 1;
            let allKanji = [];
            for (let i = 1; i <= maxDefinedLevel; i++) {
                allKanji = allKanji.concat(n5LevelsData[i]);
            }
            levelQueue = allKanji.sort(() => Math.random() - 0.5);
        }

        currentQuestionIndex = 0;
        spawnNextQuestion();
    }

    function resetQuestionTimer() {
        timeLeft = 10;
        isCritMode = false;

        const timerBox = document.getElementById('timer-box');
        const progressBar = document.getElementById('time-progress-bar');

        document.getElementById('timer').innerText = timeLeft;
        timerBox.classList.remove('crit-mode');
        document.getElementById('crit-banner').style.display = 'none';

        progressBar.style.transition = 'none';
        progressBar.style.width = '100%';
        progressBar.className = 'time-progress-bar';
        void progressBar.offsetWidth;
        progressBar.style.transition = 'width 1s linear, background 0.3s ease';
        progressBar.style.width = '90%';

        clearInterval(timerInterval);
        timerInterval = setInterval(updateTimer, 1000);
    }

    function updateTimer() {
        timeLeft--;
        document.getElementById('timer').innerText = Math.max(0, timeLeft);

        const progressBar = document.getElementById('time-progress-bar');
        const nextPercent = Math.max(0, (timeLeft - 1) * 10);
        progressBar.style.width = nextPercent + '%';

        if (timeLeft <= 5 && timeLeft > 3) {
            progressBar.className = 'time-progress-bar warn';
        }

        if (timeLeft <= 3 && !isCritMode) {
            isCritMode = true;
            document.getElementById('timer-box').classList.add('crit-mode');
            document.getElementById('crit-banner').style.display = 'block';
            progressBar.className = 'time-progress-bar danger';
        }

        if (timeLeft <= 0) {
            endGame(false);
        }
    }

    function spawnNextQuestion() {
        if (currentQuestionIndex >= levelQueue.length) {
            const finishedLvl = currentLevel;
            currentLevel++;
            playSound('levelup');
            showLevelUpToast(finishedLvl, currentLevel);
            return;
        }

        currentQuestion = levelQueue[currentQuestionIndex];
        document.getElementById('kanji-display').innerText = currentQuestion.kanji;
        document.getElementById('progress-display').innerText = `Tiến độ bài: ${currentQuestionIndex + 1} / ${levelQueue.length}`;
        inputField.value = '';

        resetQuestionTimer();
        inputField.focus();
        isShooting = false;
    }

    function showLevelUpToast(oldLvl, nextLvl) {
        clearInterval(timerInterval);
        const toast = document.getElementById('levelup-toast');
        const maxDefinedLevel = Object.keys(n5LevelsData).length;
        document.getElementById('levelup-title').innerText = `HOÀN THÀNH BÀI KANJI ${oldLvl}!`;
        document.getElementById('levelup-sub').innerText = nextLvl <= maxDefinedLevel
            ? `Đang tiến vào Bài Kanji ${nextLvl}...`
            : `Mở khóa Chế Độ Vô Tận!`;
        toast.style.display = 'block';

        setTimeout(() => {
            toast.style.display = 'none';
            loadLevel(nextLvl);
        }, 1500);
    }

    function submitAnswer() {
        if (isShooting || !currentQuestion) return;

        const userTyped = inputField.value.trim().toLowerCase().replace(/\s+/g, '');
        if (!userTyped) return;

        if (userTyped === currentQuestion.romaji || userTyped === currentQuestion.hira) {
            isShooting = true;
            clearInterval(timerInterval);
            combo++;
            if (combo > 1) {
                const cb = document.getElementById('combo-badge');
                cb.innerText = `🔥 COMBO x${combo}`;
                cb.style.display = 'block';
            }
            shootPea();
        } else {
            combo = 0;
            document.getElementById('combo-badge').style.display = 'none';
            inputField.classList.remove('shake');
            void inputField.offsetWidth;
            inputField.classList.add('shake');
            setTimeout(() => inputField.classList.remove('shake'), 350);
        }
    }

    function shootPea() {
        playSound('shoot');
        const peaWrap = document.getElementById('peashooter-wrap');
        peaWrap.classList.remove('shoot');
        void peaWrap.offsetWidth;
        peaWrap.classList.add('shoot');

        const arena = document.getElementById('arena');
        const pea = document.createElement('div');
        pea.className = `peashot ${isCritMode ? 'crit' : ''}`;
        arena.appendChild(pea);

        const startX = 86;
        const targetX = Math.max(190, arena.offsetWidth - 98);
        const duration = 220;
        const startTime = performance.now();

        function animateShot(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            pea.style.left = (startX + (targetX - startX) * progress) + 'px';

            if (progress < 1) {
                requestAnimationFrame(animateShot);
            } else {
                pea.remove();
                spawnHitParticles(targetX + 10);
                damageZombie();
                currentQuestionIndex++;
                spawnNextQuestion();
            }
        }
        requestAnimationFrame(animateShot);
    }

    function spawnHitParticles(hitX) {
        const arena = document.getElementById('arena');
        const color = isCritMode ? '#f97316' : '#4ade80';
        for (let i = 0; i < 8; i++) {
            const p = document.createElement('div');
            p.className = 'hit-particle';
            p.style.background = color;
            p.style.boxShadow = `0 0 8px ${color}`;
            p.style.left = hitX + 'px';
            p.style.bottom = '58px';
            const angle = (Math.PI * 2 * i) / 8;
            const dist = 24 + Math.random() * 22;
            p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
            p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
            arena.appendChild(p);
            setTimeout(() => p.remove(), 460);
        }
    }

    function showFloatingDamage(dmg, crit) {
        const arena = document.getElementById('arena');
        const el = document.createElement('div');
        el.className = `dmg-float ${crit ? 'crit' : ''}`;
        el.innerText = crit ? `CRIT -${dmg}!` : `-${dmg}`;
        arena.appendChild(el);
        setTimeout(() => el.remove(), 760);
    }

    function updateZombieAppearance() {
        const cone = document.getElementById('zombie-armor-cone');
        const bucket = document.getElementById('zombie-armor-bucket');
        const rank = document.getElementById('zombie-rank');

        if (kills >= 15) {
            cone.style.display = 'none';
            bucket.style.display = 'block';
            rank.innerText = 'BUCKET ZOMBIE';
            rank.style.background = 'rgba(71, 85, 105, 0.9)';
        } else if (kills >= 5) {
            cone.style.display = 'block';
            bucket.style.display = 'none';
            rank.innerText = 'CONE ZOMBIE';
            rank.style.background = 'rgba(194, 65, 12, 0.9)';
        } else {
            cone.style.display = 'none';
            bucket.style.display = 'none';
            rank.innerText = 'ZOMBIE N5';
            rank.style.background = 'rgba(127, 29, 29, 0.9)';
        }
    }

    function damageZombie() {
        playSound('hit');
        const baseDamage = isCritMode ? 50 : 25;
        const damage = baseDamage + Math.min(combo * 5, 25);
        currentZombieHP -= damage;

        showFloatingDamage(damage, isCritMode);

        const zombieBox = document.getElementById('zombie-box');
        zombieBox.classList.add('hit');
        setTimeout(() => zombieBox.classList.remove('hit'), 150);

        if (currentZombieHP <= 0) {
            kills++;
            document.getElementById('kills').innerText = kills;
            if (kills > highScore) {
                highScore = kills;
                localStorage.setItem('kanji_zombie_best', highScore);
                document.getElementById('high-score').innerText = highScore;
            }
            currentZombieHP = 100;
            updateZombieAppearance();
        }

        document.getElementById('hp-bar').style.width = Math.max(0, (currentZombieHP / maxZombieHP) * 100) + '%';
    }

    function endGame(isWin) {
        playSound('gameover');
        clearInterval(timerInterval);
        document.getElementById('end-title').innerText = isWin ? "VICTORY!" : "HẾT GIỜ RỒI!";
        document.getElementById('end-title').className = isWin ? "win" : "";
        document.getElementById('missed-kanji').innerText = currentQuestion.kanji;
        document.getElementById('correct-ans').innerText = `${currentQuestion.hira} (${currentQuestion.romaji})`;
        document.getElementById('final-kills').innerText = kills;
        document.getElementById('end-screen').style.display = 'flex';
    }
</script>

</body>
</html>
