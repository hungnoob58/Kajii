<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <title>KANJI VS ZOMBIE - Full N5 Edition</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: #0d1117; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
        }

        .game-container { 
            background: #1f2937; 
            border: 4px solid #10b981; 
            border-radius: 16px; 
            padding: 20px; 
            width: 100%; 
            max-width: 680px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
            position: relative; 
            overflow: hidden; 
        }

        /* Top Status Bar */
        .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: bold; background: #374151; padding: 10px 16px; border-radius: 8px; margin-bottom: 15px; }
        .level-badge { background: #3b82f6; padding: 4px 10px; border-radius: 6px; color: #fff; font-weight: 800; }
        .timer { color: #f59e0b; font-size: 20px; display: inline-block; width: 35px; }
        .timer.crit-mode { color: #ef4444; font-size: 24px; animation: pulse 0.5s infinite alternate; }

        /* Battle Arena */
        .battle-field { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end; 
            height: 200px; 
            background: linear-gradient(180deg, #15803d 0%, #166534 60%, #14532d 100%);
            background-image: radial-gradient(#22c55e 10%, transparent 11%);
            background-size: 20px 20px;
            border-bottom: 8px solid #052e16; 
            padding: 0 20px 10px 20px; 
            margin-bottom: 15px; 
            position: relative; 
            border-radius: 10px; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }
        
        .character-box { width: 110px; display: flex; flex-direction: column; align-items: center; }
        .svg-char { width: 100px; height: 110px; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); }
        .zombie-box { transition: transform 0.1s; }
        .zombie-box.hit { transform: translateX(15px) rotate(8deg); filter: brightness(1.8) drop-shadow(0 0 10px red); }

        /* HP Bar */
        .hp-bar-bg { width: 100px; height: 12px; background: #4b5563; border-radius: 6px; overflow: hidden; border: 2px solid #fff; margin-bottom: 8px; }
        .hp-bar-fill { width: 100%; height: 100%; background: #ef4444; transition: width 0.2s; }

        /* Kanji Question Box */
        .question-box { background: #f3f4f6; color: #1f2937; border-radius: 12px; padding: 20px; margin-bottom: 15px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
        .kanji-text { font-size: 60px; font-weight: 800; line-height: 1.1; }
        .progress-text { font-size: 13px; color: #6b7280; margin-top: 5px; font-weight: bold; }

        /* Input Controls */
        .input-group { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 12px 18px; font-size: 20px; border-radius: 8px; border: 3px solid #3b82f6; outline: none; text-align: center; font-weight: bold; background: #f9fafb; color: #111827; }
        input[type="text"]:focus { border-color: #10b981; box-shadow: 0 0 10px rgba(16,185,129,0.5); }
        .btn-submit { background: #10b981; color: white; border: none; padding: 0 24px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-submit:hover { background: #059669; }

        /* Crit Banner Overlay */
        .crit-banner { display: none; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); background: #dc2626; color: #fff; padding: 6px 20px; font-size: 14px; font-weight: 900; border-radius: 20px; box-shadow: 0 0 15px #f59e0b; text-transform: uppercase; letter-spacing: 1px; z-index: 10; animation: pulse 0.6s infinite alternate; }

        /* Animations & Projectile */
        @keyframes pulse { from { transform: translateX(-50%) scale(1); } to { transform: translateX(-50%) scale(1.1); } }
        .peashot { position: absolute; width: 22px; height: 22px; background: #10b981; border-radius: 50%; border: 2px solid #fff; bottom: 45px; left: 110px; z-index: 5; box-shadow: 0 0 6px #10b981; }
        .peashot.crit { background: #ef4444; border-color: #fbbf24; box-shadow: 0 0 12px #f59e0b; width: 30px; height: 30px; }

        /* Result Overlay */
        .overlay { display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.92); flex-direction: column; justify-content: center; align-items: center; z-index: 20; padding: 20px; }
        .overlay h2 { font-size: 32px; margin-bottom: 10px; color: #ef4444; }
        .overlay h2.win { color: #10b981; }
        .btn-restart { background: #2563eb; color: white; border: none; padding: 12px 32px; font-size: 18px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; }
        .btn-restart:hover { background: #1d4ed8; }
    </style>
</head>

            { kanji: '思う', hira: 'おもう', romaji: 'omou' },
            { kanji: ' meいます', hira: 'おもいます', romaji: 'omoimasu' }
        ],
        18: [ // Bài 18: 心 思 知
            { kanji: '心', hira: 'こころ', romaji: 'kokoro' },
            { kanji: '知る', hira: 'しる', romaji: 'shiru' },
            { kanji: '知ります', hira: 'しります', romaji: 'shirimasu' },
            { kanji: '知人', hira: 'ちじん', romaji: 'chijin' }
        ],
        19: [ // Bài 19: 田 町 村
            { kanji: '田', hira: 'た', romaji: 'ta' },
            { kanji: '田中', hira: 'たなか', romaji: 'tanaka' },
            { kanji: '町', hira: 'まち', romaji: 'machi' },
            { kanji: '村', hira: 'むら', romaji: 'mura' }
        ],
        20: [ // Bài 20: 魚 肉 犬 猫
            { kanji: '魚', hira: 'さかな', romaji: 'sakana' },
            { kanji: '肉', hira: 'にく', romaji: 'niku' },
            { kanji: '牛肉', hira: 'ぎゅうにく', romaji: 'gyuuniku' },
            { kanji: '豚肉', hira: 'ぶたにく', romaji: 'butaniku' },
            { kanji: '鳥肉', hira: 'とりのく', romaji: 'toriniku' },
            { kanji: '犬', hira: 'いぬ', romaji: 'inu' },
            { kanji: '猫', hira: 'ねこ', romaji: 'neko' }
        ]
    };

    // Chuẩn hóa tự động xóa mọi khoảng trắng trong đáp án
    for (let lvl in n5LevelsData) {
        n5LevelsData[lvl].forEach(item => {
            item.romaji = item.romaji.replace(/\s+/g, '');
            item.hira = item.hira.replace(/\s+/g, '');
        });
    }

    let currentLevel = 1;
    let levelQueue = [];
    let currentQuestionIndex = 0;
    
    let timeLeft = 10;
    let kills = 0;
    let currentZombieHP = 100;
    let maxZombieHP = 100;
    let currentQuestion = null;
    let timerInterval = null;
    let isCritMode = false;
    let isShooting = false;

    const inputField = document.getElementById('type-input');

    inputField.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            submitAnswer();
        }
    });

    window.onload = function() {
        startGame();
    };

    function startGame() {
        kills = 0;
        currentLevel = 1;
        currentZombieHP = 100;
        document.getElementById('kills').innerText = kills;
        document.getElementById('end-screen').style.display = 'none';
        document.getElementById('hp-bar').style.width = '100%';
        
        loadLevel(currentLevel);
    }

    function loadLevel(lvl) {
        currentLevel = lvl;
        const maxDefinedLevel = Object.keys(n5LevelsData).length;
        
        if (currentLevel <= maxDefinedLevel) {
            document.getElementById('level-display').innerText = `BÀI KANJI ${currentLevel}`;
            levelQueue = [...n5LevelsData[currentLevel]].sort(() => Math.random() - 0.5);
        } else {
            document.getElementById('level-display').innerText = `CẤP ${currentLevel} (TRỘN VÔ TẬN)`;
            let allKanji = [];
            for (let i = 1; i <= maxDefinedLevel; i++) {
                allKanji = allKanji.concat(n5LevelsData[i]);
            }
            levelQueue = allKanji.sort(() => Math.random() - 0.5);
        }
        
        currentQuestionIndex = 0;
        spawnNextQuestion();
    }

    function resetQuestionTimer() {
        timeLeft = 10;
        isCritMode = false;

        document.getElementById('timer').innerText = timeLeft;
        document.getElementById('timer').classList.remove('crit-mode');
        document.getElementById('crit-banner').style.display = 'none';

        clearInterval(timerInterval);
        timerInterval = setInterval(updateTimer, 1000);
    }

    function updateTimer() {
        timeLeft--;
        document.getElementById('timer').innerText = timeLeft;

        if (timeLeft <= 3 && !isCritMode) {
            isCritMode = true;
            document.getElementById('timer').classList.add('crit-mode');
            document.getElementById('crit-banner').style.display = 'block';
        }

        if (timeLeft <= 0) {
            endGame(false);
        }
    }

    function spawnNextQuestion() {
        if (currentQuestionIndex >= levelQueue.length) {
            currentLevel++;
            alert(`🎉 EXCELLENT! HOÀN THÀNH BÀI KANJI ${currentLevel - 1}! CHUYỂN SANG BÀI TIẾP THEO!`);
            loadLevel(currentLevel);
            return;
        }

        currentQuestion = levelQueue[currentQuestionIndex];

        document.getElementById('kanji-display').innerText = currentQuestion.kanji;
        document.getElementById('progress-display').innerText = `Tiến độ: ${currentQuestionIndex + 1}/${levelQueue.length}`;
        inputField.value = '';

        resetQuestionTimer();
        inputField.focus();
        isShooting = false;
    }

    function submitAnswer() {
        if (isShooting || !currentQuestion) return;

        const userTyped = inputField.value.trim().toLowerCase();
        if (!userTyped) return;

        const targetRomaji = currentQuestion.romaji;
        const targetHira = currentQuestion.hira;

        if (userTyped === targetRomaji || userTyped === targetHira) {
            isShooting = true;
            clearInterval(timerInterval);
            shootPea();
        } else {
            inputField.style.borderColor = '#ef4444';
            setTimeout(() => inputField.style.borderColor = '#3b82f6', 300);
        }
    }

    function shootPea() {
        const arena = document.getElementById('arena');
        const pea = document.createElement('div');
        pea.className = `peashot ${isCritMode ? 'crit' : ''}`;
        arena.appendChild(pea);

        let position = 110;
        const shotAnimation = setInterval(() => {
            position += 25;
            pea.style.left = position + 'px';

            if (position >= 500) {
                clearInterval(shotAnimation);
                pea.remove();
                damageZombie();
                currentQuestionIndex++;
                spawnNextQuestion();
            }
        }, 10);
    }

    function damageZombie() {
        const damage = isCritMode ? 50 : 25; 
        currentZombieHP -= damage;

        const zombieBox = document.getElementById('zombie-box');
        zombieBox.classList.add('hit');
        setTimeout(() => zombieBox.classList.remove('hit'), 150);

        if (currentZombieHP <= 0) {
            kills++;
            document.getElementById('kills').innerText = kills;
            currentZombieHP = 100;
        }

        const hpPercent = Math.max(0, (currentZombieHP / maxZombieHP) * 100);
        document.getElementById('hp-bar').style.width = hpPercent + '%';
    }

    function endGame(isWin) {
        clearInterval(timerInterval);
        document.getElementById('end-title').innerText = isWin ? "VICTORY!" : "GAME OVER!";
        document.getElementById('end-title').className = isWin ? "win" : "";
        document.getElementById('correct-ans').innerText = `${currentQuestion.hira} (${currentQuestion.romaji})`;
        document.getElementById('final-kills').innerText = kills;
        document.getElementById('end-screen').style.display = 'flex';
    }
</script>

</body>
</html>
