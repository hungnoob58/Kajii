    let quizList = [];
    let currentIndex = 0;
    let score = 0;

    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function initQuiz() {
        quizList = shuffleArray(rawKanjiList);
        currentIndex = 0;
        score = 0;
        document.getElementById('total-questions').innerText = quizList.length;
        document.getElementById('score').innerText = score;
        loadQuestion();
    }

    function loadQuestion() {
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('current-index').innerText = currentIndex + 1;
        
        const q = quizList[currentIndex];
        document.getElementById('kanji').innerText = q.kanji;
        
        let allOptions = shuffleArray([q.correct, ...q.wrong]);

        const optionsContainer = document.getElementById('options');
        optionsContainer.innerHTML = '';

        allOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'btn-option';
            btn.innerText = opt;
            btn.onclick = () => checkAnswer(btn, opt === q.correct);
            optionsContainer.appendChild(btn);
        });
    }

    function checkAnswer(selectedBtn, isCorrect) {
        const buttons = document.querySelectorAll('.btn-option');
        buttons.forEach(btn => btn.disabled = true);

        if (isCorrect) {
            selectedBtn.classList.add('correct');
            score++;
        } else {
            selectedBtn.classList.add('wrong');
            buttons.forEach(btn => {
                if (quizList[currentIndex].correct === btn.innerText) {
                    btn.classList.add('correct');
                }
            });
        }

        document.getElementById('score').innerText = score;
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < quizList.length) {
            loadQuestion();
        } else {
            alert(`Xong bài test rồi nhé! Kết quả: ${score}/${quizList.length}`);
            initQuiz();
        }
    }

    initQuiz();
