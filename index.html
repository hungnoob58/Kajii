<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANJI VS ZOMBIE - Menu</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: #0d1117; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
        }

        .menu-container { 
            background: linear-gradient(180deg, #052e16 0%, #0f172a 100%);
            border: 4px solid #10b981; 
            border-radius: 16px; 
            padding: 40px 30px; 
            width: 100%; 
            max-width: 600px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); 
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .game-title {
            font-size: 48px;
            font-weight: 900;
            color: #22c55e;
            text-shadow: 0 0 12px #15803d, 3px 3px 0px #000;
            margin: 0 0 10px 0;
            letter-spacing: 2px;
        }

        .game-subtitle {
            font-size: 18px;
            color: #fbbf24;
            margin-bottom: 35px;
            font-weight: bold;
        }

        .btn-play {
            background: linear-gradient(180deg, #22c55e 0%, #15803d 100%);
            color: white;
            border: 3px solid #bbf7d0;
            padding: 16px 48px;
            font-size: 24px;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
            transition: all 0.2s;
            text-shadow: 1px 1px 2px #000;
            text-decoration: none;
            display: inline-block;
        }

        .btn-play:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 25px rgba(34, 197, 94, 0.6);
        }

        .instructions {
            margin-top: 35px;
            background: rgba(0,0,0,0.4);
            padding: 20px;
            border-radius: 12px;
            font-size: 14px;
            color: #d1d5db;
            text-align: left;
            width: 100%;
            max-width: 480px;
            line-height: 1.6;
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

<div class="menu-container">
    <h1 class="game-title">KANJI VS ZOMBIE</h1>
    <div class="game-subtitle">Ôn Luyện Trọn Bộ Kanji N5 (80+ Từ)</div>
    
    <a href="game.html" class="btn-play">BẮT ĐẦU CHƠI 🎯</a>

    <div class="instructions">
        📌 <b>Luật chơi:</b><br>
        • Nhìn từ Kanji hiển thị và gõ <b>Romaji</b> hoặc <b>Hiragana</b>.<br>
        • Mỗi câu hỏi có <b>60 giây</b> đếm ngược.<br>
        • <b>10s CUỐI:</b> Bắn ra Đạn Lửa x2 Sát Thương (Crit Dame)!<br>
        • Diệt càng nhiều Zombie càng tốt!
    </div>
</div>

</body>
</html>
