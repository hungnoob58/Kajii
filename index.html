<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Học Kanji N5</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 8px;
            font-size: 24px;
        }

        p.subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Menu Styles */
        .menu-btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            margin-bottom: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: #fff;
            color: #333;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
        }

        .menu-btn:hover {
            border-color: #4f46e5;
            background-color: #f5f3ff;
            color: #4f46e5;
            transform: translateY(-2px);
        }

        .menu-btn small {
            display: block;
            font-size: 12px;
            font-weight: normal;
            color: #777;
            margin-top: 2px;
        }

        /* Game Screen Styles */
        .hidden {
            display: none !important;
        }

        .kanji-display {
            font-size: 64px;
            font-weight: bold;
            color: #4f46e5;
            margin: 20px 0;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 100%;
            gap: 10px;
            margin-bottom: 20px;
        }

        .opt-btn {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: #fff;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .opt-btn:hover {
            border-color: #4f46e5;
            background: #f5f3ff;
        }

        .back-btn {
            background: none;
            border: none;
            color: #666;
            cursor: pointer;
            font-size: 14px;
            text-decoration: underline;
        }

        .score-board {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- SCREEN 1: MENU MAIN -->
        <div id="menu-screen">
            <h1>🎮 KANJI N5 GAME</h1>
            <p class="subtitle">Chọn chế độ chơi để bắt đầu ôn tập</p>

            <button class="menu-btn" onclick="startGame('single')">
                1. Ôn Từ Đơn
                <small>Luyện tập 80+ Kanji N5 riêng lẻ</small>
            </button>

            <button class="menu-btn" onclick="startGame('compound')">
                2. Ôn Từ Ghép
                <small>Ghép Kanji thành 100+ từ vựng N5</small>
            </button>

            <button class="menu-btn" onclick="startGame('all')">
                3. Chế Độ Trộn
                <small>Thử thách tổng hợp cả từ đơn lẫn từ ghép</small>
            </button>
        </div>

        <!-- SCREEN 2: GAMEPLAY -->
        <div id="game-screen" class="hidden">
            <div class="score-board">
                <span>Điểm: <strong id="score">0</strong></span>
            </div>

            <div class="kanji-display" id="kanji-target">日</div>

            <div class="options-grid" id="options-container">
                <!-- Nút đáp án tự động load -->
            </div>

            <button class="back-btn" onclick="showMenu()">← Trở về Menu chính</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
