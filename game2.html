<!DOCTYPE html>

<head>

        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { 
            background: #0d1117; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 15px; 
        }

        .game-container { 
            background: #1f2937; 
            border: 4px solid #8b5cf6; 
            border-radius: 16px; 
            padding: 18px; 
            width: 100%; 
            max-width: 650px; 
            text-align: center; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.85); 
            position: relative; 
            overflow: hidden; 
        }

        /* Top Status Bar */
        .status-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 8px;
            font-size: 14px; 
            font-weight: bold; 
            background: #374151; 
            padding: 8px 14px; 
            border-radius: 8px; 
            margin-bottom: 12px; 
            flex-wrap: wrap;
        }
        select.level-select {
            background: #7c3aed;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: 800;
            cursor: pointer;
            outline: none;
        }
        .high-score { color: #fbbf24; }

        /* Battle Arena */
        .battle-field { 
            display: flex; 
            justify-content: space-between; 
            align-items: flex-end; 
            height: 155px; 
            background: linear-gradient(180deg, #1e1b4b 0%, #312e81 65%, #1e1b4b 100%);
            border-bottom: 6px solid #4c1d95; 
            padding: 0 25px 8px 25px; 
            margin-bottom: 12px; 
            position: relative; 
            border-radius: 10px; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.6);
        }
        
        .character-box { width: 95px; display: flex; flex-direction: column; align-items: center; }
        .svg-char { width: 85px; height: 95px; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.6)); }
        .zombie-box { transition: transform 0.12s; }
        .zombie-box.hit { transform: translateX(16px) rotate(8deg); filter: brightness(1.8) drop-shadow(0 0 12px #a855f7); }

        /* HP Bar */
        .hp-bar-bg { width: 90px; height: 10px; background: #4b5563; border-radius: 6px; overflow: hidden; border: 2px solid #fff; margin-bottom: 6px; }
        .hp-bar-fill { width: 100%; height: 100%; background: #ef4444; transition: width 0.25s; }

        /* Prompt Box */
        .prompt-box { 
            background: #f3f4f6; 
            color: #111827; 
            border-radius: 10px; 
            padding: 12px; 
            margin-bottom: 12px; 
            position: relative;
        }
        .reading-text { font-size: 28px; font-weight: 900; color: #4f46e5; letter-spacing: 1px; }
        .meaning-text { font-size: 16px; font-weight: 700; color: #374151; margin-top: 2px; }
        .progress-text { font-size: 12px; color: #6b7280; margin-top: 4px; font-weight: bold; }
        .combo-badge { position: absolute; top: 8px; right: 12px; background: #f59e0b; color: #111; padding: 2px 8px; font-size: 12px; font-weight: 900; border-radius: 6px; display: none; }

        /* Drawing Pad Area */
        .pad-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        .canvas-container {
            position: relative;
            width: 240px;
            height: 240px;
            background: #fefce8;
            border: 4px solid #d97706;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5), inset 0 0 15px rgba(217, 119, 6, 0.2);
            touch-action: none;
        }
        .canvas-grid {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background-image: 
                linear-gradient(to right, transparent 49.5%, rgba(217, 119, 6, 0.25) 49.5%, rgba(217, 119, 6, 0.25) 50.5%, transparent 50.5%),
                linear-gradient(to bottom, transparent 49.5%, rgba(217, 119, 6, 0.25) 49.5%, rgba(217, 119, 6, 0.25) 50.5%, transparent 50.5%);
        }
        .ghost-kanji {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 175px;
            font-family: "Hiragino Kaku Gothic Pro", "Yu Gothic", "Meiryo", sans-serif;
            color: rgba(156, 163, 175, 0.32);
            pointer-events: none;
            display: none;
            line-height: 1;
        }
        canvas#draw-canvas {
            position: relative;
            z-index: 2;
            cursor: crosshair;
            border-radius: 8px;
        }

        .feedback-msg {
            height: 22px;
            font-size: 14px;
            font-weight: 800;
            color: #fbbf24;
        }

        .controls {
            display: flex;
            gap: 8px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            color: #fff;
        }
        .btn:active { transform: scale(0.96); }
        .btn-clear { background: #4b5563; }
        .btn-clear:hover { background: #374151; }
        .btn-hint { background: #d97706; }
        .btn-hint:hover { background: #b45309; }
        .btn-cast { background: #8b5cf6; padding: 10px 26px; font-size: 16px; box-shadow: 0 0 12px rgba(139, 92, 246, 0.6); }
        .btn-cast:hover { background: #7c3aed; }

        .spell-shot { 
            position: absolute; 
            width: 34px; 
            height: 34px; 
            background: radial-gradient(circle, #fff 10%, #c084fc 50%, #7e22ce 100%);
            border-radius: 50%; 
            bottom: 35px; 
            left: 100px; 
            z-index: 5; 
            box-shadow: 0 0 18px #a855f7, 0 0 30px #ec4899; 
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            color: #3b0764;
            font-size: 18px;
        }
    </style>
</head>

    let isDrawing = false;
    let hasDrawn = false;
    let hintUsed = false;
    let isCasting = false;

    let queue = [];
    let qIndex = 0;
    let currentQ = null;
    let kills = 0;
    let combo = 0;
    let highScore = localStorage.getItem('kanji_write_best') || 0;
    let zombieHP = 100;

    document.getElementById('high-score').innerText = highScore;

    const levelSelect = document.getElementById('level-select');
    const mixOpt = document.createElement('option');
    mixOpt.value = 'all';
    mixOpt.innerText = '🔥 TRỘN TẤT CẢ N5';
    levelSelect.appendChild(mixOpt);

    for (let i = 1; i <= 20; i++) {
        const opt = document.createElement('option');
        opt.value = i;
        opt.innerText = `BÀI KANJI ${i}`;
        levelSelect.appendChild(opt);
    }
    levelSelect.value = '1';

    function getPos(e) {
        const rect = drawCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: clientX - rect.left,
            y: clientY - rect.top
        };
    }

    function startDraw(e) {
        if (isCasting) return;
        isDrawing = true;
        hasDrawn = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        e.preventDefault();
    }

    function moveDraw(e) {
        if (!isDrawing || isCasting) return;
        const pos = getPos(e);
        ctx.lineWidth = 10; // Giảm xuống 10 cho thanh thoát, tránh quá dày
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#111827';
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        e.preventDefault();
    }

    function endDraw() {
        isDrawing = false;
    }

    drawCanvas.addEventListener('mousedown', startDraw);
    drawCanvas.addEventListener('mousemove', moveDraw);
    window.addEventListener('mouseup', endDraw);

    drawCanvas.addEventListener('touchstart', startDraw, { passive: false });
    drawCanvas.addEventListener('touchmove', moveDraw, { passive: false });
    window.addEventListener('touchend', endDraw);

    let audioCtx = null;
    function playSound(type) {
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'cast') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(850, now + 0.25);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, now);
                osc.frequency.linearRampToValueAtTime(45, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'fail') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        } catch (e) {}
    }

    function clearCanvas() {
        ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        hasDrawn = false;
    }

    function toggleHint() {
        const ghost = document.getElementById('ghost-kanji');
        if (ghost.style.display === 'block') {
            ghost.style.display = 'none';
        } else {
            ghost.style.display = 'block';
            hintUsed = true;
            setFeedback("Đã bật nét mờ (Sát thương giảm nhẹ)", "#f59e0b");
        }
    }

    function setFeedback(text, color) {
        const el = document.getElementById('feedback-msg');
        el.innerText = text;
        el.style.color = color;
    }

    function changeLevel() {
        const val = levelSelect.value;
        let list = [];
        if (val === 'all') {
            for (let i = 1; i <= 20; i++) {
                list = list.concat(n5KanjiWriteData[i]);
            }
        } else {
            list = [...n5KanjiWriteData[val]];
        }
        queue = list.sort(() => Math.random() - 0.5);
        qIndex = 0;
        nextQuestion();
    }

    function nextQuestion() {
        if (qIndex >= queue.length) {
            setFeedback("🎉 Xong vòng! Tự động trộn lại bài...", "#10b981");
            queue = queue.sort(() => Math.random() - 0.5);
            qIndex = 0;
        }

        currentQ = queue[qIndex];
        document.getElementById('reading-display').innerText = `${currentQ.hira} (${currentQ.romaji})`;
        document.getElementById('meaning-display').innerText = `Nghĩa: ${currentQ.mean}`;
        document.getElementById('progress-display').innerText = `Tiến độ: ${qIndex + 1}/${queue.length}`;

        const ghost = document.getElementById('ghost-kanji');
        ghost.innerText = currentQ.kanji;
        ghost.style.display = 'none';
        hintUsed = false;

        targetCtx.clearRect(0, 0, targetCanvas.width, targetCanvas.height);
        targetCtx.font = 'bold 160px "Hiragino Kaku Gothic Pro", "Yu Gothic", "Meiryo", sans-serif';
        targetCtx.textAlign = 'center';
        targetCtx.textBaseline = 'middle';
        targetCtx.lineWidth = 60;
        targetCtx.strokeStyle = '#000';
        targetCtx.strokeText(currentQ.kanji, 120, 125);
        targetCtx.fillStyle = '#000';
        targetCtx.fillText(currentQ.kanji, 120, 125);

        clearCanvas();
        isCasting = false;
    }

    function checkKanji() {
        if (isCasting || !currentQ) return;
        if (!hasDrawn) {
            setFeedback("⚠️ Ông chưa vẽ nét nào lên bảng kìa!", "#ef4444");
            return;
        }

        const userData = ctx.getImageData(0, 0, 240, 240).data;
        const targetData = targetCtx.getImageData(0, 0, 240, 240).data;

        let targetPixels = 0;
        let matchedPixels = 0;
        let userTotalPixels = 0;

        for (let i = 3; i < targetData.length; i += 4) {
            if (targetData[i] > 50) targetPixels++;
            if (userData[i] > 50) {
                userTotalPixels++;
                if (targetData[i] > 50) {
                    matchedPixels++;
                }
            }
        }

        if (userTotalPixels < 30) {
            setFeedback("⚠️ Viết ngắn quá! Viết rõ nét hơn chút nhé.", "#ef4444");
            return;
        }
        if (userTotalPixels > 9000) { // Nới giới hạn lên 9000 pixel để thoải mái viết các chữ khung to (như 四, 口, 田...)
            setFeedback("⚠️ Viết gọn tay lại chút nhé ông tướng!", "#ef4444");
            return;
        }

        const coverage = matchedPixels / Math.max(1, targetPixels);

        if (coverage >= 0.12) {
            isCasting = true;
            combo++;
            if (combo > 1) {
                const cb = document.getElementById('combo-badge');
                cb.innerText = `COMBO x${combo}`;
                cb.style.display = 'block';
            }
            setFeedback(`✨ CHÍNH XÁC! Phóng bùa "${currentQ.kanji}"!`, "#10b981");
            castSpell(currentQ.kanji);
        } else {
            combo = 0;
            document.getElementById('combo-badge').style.display = 'none';
            playSound('fail');
            setFeedback(`❌ Chưa đúng chữ "${currentQ.kanji}" lắm! Thử viết lại xem.`, "#ef4444");
            
            const container = document.querySelector('.canvas-container');
            container.style.borderColor = '#ef4444';
            setTimeout(() => container.style.borderColor = '#d97706', 350);
        }
    }

    function castSpell(kanjiChar) {
        playSound('cast');
        const arena = document.getElementById('arena');
        const spell = document.createElement('div');
        spell.className = 'spell-shot';
        spell.innerText = kanjiChar;
        arena.appendChild(spell);

        let pos = 100;
        const anim = setInterval(() => {
            pos += 22;
            spell.style.left = pos + 'px';

            if (pos >= 470) {
                clearInterval(anim);
                spell.remove();
                damageZombie();
                qIndex++;
                nextQuestion();
            }
        }, 12);
    }

    function damageZombie() {
        playSound('hit');
        const baseDmg = hintUsed ? 35 : 50;
        const dmg = baseDmg + Math.min(combo * 5, 25);
        zombieHP -= dmg;

        const zBox = document.getElementById('zombie-box');
        zBox.classList.add('hit');
        setTimeout(() => zBox.classList.remove('hit'), 160);

        if (zombieHP <= 0) {
            kills++;
            document.getElementById('kills').innerText = kills;
            if (kills > highScore) {
                highScore = kills;
                localStorage.setItem('kanji_write_best', highScore);
                document.getElementById('high-score').innerText = highScore;
            }
            zombieHP = 100;
        }

        const hpPct = Math.max(0, zombieHP);
        document.getElementById('hp-bar').style.width = hpPct + '%';
    }

    window.onload = function() {
        changeLevel();
    };
</script>

</body>
