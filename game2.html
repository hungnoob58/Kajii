<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>KANJI VS ZOMBIE - Luyện Viết Bùa Kanji N5</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kanji vs Zombie">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#3b0764">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #070b14;
            background-image: 
                radial-gradient(circle at 50% 15%, rgba(139, 92, 246, 0.2), transparent 60%),
                radial-gradient(rgba(168, 85, 247, 0.12) 1px, transparent 1px);
            background-size: 100% 100%, 24px 24px;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            margin: 0;
            padding: calc(8px + env(safe-area-inset-top)) 12px calc(10px + env(safe-area-inset-bottom)) 12px;
        }

        .game-container {
            background: linear-gradient(180deg, rgba(24, 18, 48, 0.96) 0%, rgba(15, 23, 42, 0.98) 100%);
            border: 3px solid #a855f7;
            border-radius: 22px;
            padding: 12px 14px 14px 14px;
            width: 100%;
            max-width: 650px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), 0 0 28px rgba(168, 85, 247, 0.25);
            position: relative;
            overflow: hidden;
        }

        /* Thanh điều hướng trên cùng */
        .top-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            margin-bottom: 8px;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(192, 132, 252, 0.35);
            color: #e2e8f0;
            text-decoration: none;
            padding: 5px 10px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .level-select-wrap {
            display: flex;
            align-items: center;
            background: linear-gradient(135deg, #7c3aed, #5b21b6);
            border: 1.5px solid #c084fc;
            border-radius: 10px;
            padding: 2px 6px;
            min-width: 0;
        }

        select.level-select {
            background: transparent;
            color: #fff;
            border: none;
            font-size: 12.5px;
            font-weight: 800;
            padding: 3px 2px;
            outline: none;
            cursor: pointer;
            max-width: 185px;
        }
        select.level-select option {
            background: #1e1b4b;
            color: #fff;
        }

        .btn-sound {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(192, 132, 252, 0.35);
            color: #fbbf24;
            width: 32px;
            height: 30px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        /* Thanh điểm số */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 27, 75, 0.75);
            border: 1px solid rgba(192, 132, 252, 0.2);
            padding: 5px 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
        }

        .stat-pill {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.38);
            padding: 3px 9px;
            border-radius: 8px;
        }

        /* Sân đấu Pháp Thuật (Đã tăng khoảng trống trên để chữ ZOMBIE PHÉP không bị cắt) */
        .battle-field {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            height: 148px;
            background: linear-gradient(180deg, #13092b 0%, #24134d 54%, #3b1c71 55%, #2e1065 100%);
            border: 2px solid rgba(192, 132, 252, 0.28);
            border-bottom: 6px solid #4c1d95;
            padding: 8px 18px 6px 18px;
            margin-bottom: 8px;
            position: relative;
            border-radius: 14px;
            box-shadow: inset 0 8px 22px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }

        .arcane-moon {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 35%, #f3e8ff, #c084fc 65%, #7e22ce);
            box-shadow: 0 0 20px rgba(192, 132, 252, 0.65);
            opacity: 0.75;
            pointer-events: none;
        }

        .stone-stripes {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 45%;
            background-image: repeating-linear-gradient(
                90deg,
                rgba(255, 255, 255, 0.04) 0px,
                rgba(255, 255, 255, 0.04) 46px,
                transparent 46px,
                transparent 92px
            );
            pointer-events: none;
        }

        .character-box {
            width: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 3;
        }

        .svg-char {
            width: 74px;
            height: 80px;
            filter: drop-shadow(0 5px 6px rgba(0, 0, 0, 0.65));
        }

        .wizard-wrap {
            animation: wizardIdle 2s ease-in-out infinite;
            transform-origin: bottom center;
        }
        .wizard-wrap.cast {
            animation: wizardCast 0.28s ease-out;
        }
        @keyframes wizardIdle {
            0%, 100% { transform: scaleY(1) translateY(0); }
            50% { transform: scaleY(1.04) translateY(-2px); }
        }
        @keyframes wizardCast {
            0% { transform: translateX(-6px) scale(0.95) rotate(-5deg); }
            50% { transform: translateX(6px) scale(1.06) rotate(4deg); }
            100% { transform: translateX(0) scale(1) rotate(0deg); }
        }

        .zombie-box { transition: transform 0.12s ease; }
        .zombie-svg-wrap {
            animation: zombieSway 2.3s ease-in-out infinite;
            transform-origin: bottom center;
        }
        @keyframes zombieSway {
            0%, 100% { transform: rotate(-2deg); }
            50% { transform: rotate(2.5deg); }
        }
        .zombie-box.hit {
            transform: translateX(15px) rotate(9deg);
            filter: brightness(1.9) drop-shadow(0 0 14px #c084fc);
        }

        .zombie-tag {
            font-size: 9px;
            font-weight: 900;
            color: #f3e8ff;
            background: rgba(107, 33, 168, 0.92);
            padding: 2px 7px;
            border-radius: 6px;
            margin-bottom: 3px;
            letter-spacing: 0.3px;
            white-space: nowrap;
            line-height: 1.1;
        }

        .hp-bar-bg {
            width: 82px;
            height: 9px;
            background: #1f2937;
            border-radius: 99px;
            overflow: hidden;
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            margin-bottom: 2px;
        }
        .hp-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #dc2626, #f43f5e);
            transition: width 0.25s ease-out;
        }

        .spell-shot {
            position: absolute;
            width: 34px;
            height: 34px;
            background: radial-gradient(circle, #ffffff 15%, #e879f9 55%, #7e22ce 100%);
            border: 2px solid #f5d0fe;
            border-radius: 50%;
            bottom: 32px;
            left: 84px;
            z-index: 6;
            box-shadow: 0 0 18px #c084fc, 0 0 30px #ec4899, -12px 0 18px rgba(192, 132, 252, 0.65);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            color: #3b0764;
            font-size: 18px;
            font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
        }

        .dmg-float {
            position: absolute;
            right: 38px;
            bottom: 84px;
            font-size: 19px;
            font-weight: 900;
            color: #f0abfc;
            text-shadow: 0 2px 0 #000, 0 0 12px #a855f7;
            pointer-events: none;
            z-index: 12;
            animation: floatDmg 0.75s ease-out forwards;
        }
        @keyframes floatDmg {
            0% { opacity: 1; transform: translateY(0) scale(0.8); }
            35% { opacity: 1; transform: translateY(-14px) scale(1.15); }
            100% { opacity: 0; transform: translateY(-36px) scale(0.95); }
        }

        .arcane-particle {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 10;
            animation: sparkOut 0.45s ease-out forwards;
        }
        @keyframes sparkOut {
            0% { opacity: 1; transform: translate(0, 0) scale(1); }
            100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.2); }
        }

        /* Thẻ đề bài gọn gàng */
        .prompt-box {
            background: linear-gradient(180deg, #ffffff 0%, #f3e8ff 100%);
            color: #111827;
            border-radius: 14px;
            padding: 8px 12px;
            margin-bottom: 8px;
            border: 2.5px solid #c084fc;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .reading-text {
            font-size: 22px;
            font-weight: 900;
            color: #5b21b6;
            letter-spacing: 0.4px;
            line-height: 1.18;
        }

        .meaning-text {
            font-size: 14px;
            font-weight: 800;
            color: #1e293b;
            margin-top: 2px;
        }

        .progress-text {
            font-size: 11px;
            color: #64748b;
            margin-top: 2px;
            font-weight: 700;
        }

        .combo-badge {
            position: absolute;
            top: 7px;
            right: 8px;
            background: linear-gradient(135deg, #f59e0b, #ea580c);
            color: #fff;
            padding: 2px 8px;
            font-size: 10.5px;
            font-weight: 900;
            border-radius: 99px;
            box-shadow: 0 3px 8px rgba(234, 88, 12, 0.45);
            display: none;
        }

        /* Khu vực Bảng Bùa Vẽ Kanji (Co vừa 1 màn hình điện thoại không cần cuộn) */
        .pad-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .canvas-container {
            position: relative;
            width: 210px;
            height: 210px;
            background: radial-gradient(circle, #fefce8 0%, #fef3c7 100%);
            border: 3.5px solid #d97706;
            border-radius: 15px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6), 0 0 14px rgba(245, 158, 11, 0.25), inset 0 0 16px rgba(217, 119, 6, 0.22);
            touch-action: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .canvas-container.shake {
            animation: padShake 0.32s ease;
            border-color: #ef4444 !important;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.65);
        }
        @keyframes padShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-7px); }
            50% { transform: translateX(7px); }
            75% { transform: translateX(-4px); }
        }

        .canvas-grid {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image: 
                linear-gradient(to right, transparent 49.5%, rgba(217, 119, 6, 0.28) 49.5%, rgba(217, 119, 6, 0.28) 50.5%, transparent 50.5%),
                linear-gradient(to bottom, transparent 49.5%, rgba(217, 119, 6, 0.28) 49.5%, rgba(217, 119, 6, 0.28) 50.5%, transparent 50.5%);
        }

        .talisman-corner {
            position: absolute;
            width: 13px;
            height: 13px;
            border-color: rgba(180, 83, 9, 0.55);
            border-style: solid;
            pointer-events: none;
        }
        .tc-tl { top: 5px; left: 5px; border-width: 2.5px 0 0 2.5px; border-top-left-radius: 4px; }
        .tc-tr { top: 5px; right: 5px; border-width: 2.5px 2.5px 0 0; border-top-right-radius: 4px; }
        .tc-bl { bottom: 5px; left: 5px; border-width: 0 0 2.5px 2.5px; border-bottom-left-radius: 4px; }
        .tc-br { bottom: 5px; right: 5px; border-width: 0 2.5px 2.5px 0; border-bottom-right-radius: 4px; }

        .ghost-kanji {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 152px;
            font-family: "Hiragino Kaku Gothic Pro", "Yu Gothic", "Meiryo", sans-serif;
            color: rgba(148, 163, 184, 0.34);
            pointer-events: none;
            display: none;
            line-height: 1;
        }

        canvas#draw-canvas {
            position: relative;
            z-index: 2;
            cursor: crosshair;
            border-radius: 12px;
            display: block;
            width: 100%;
            height: 100%;
        }

        .feedback-msg {
            min-height: 18px;
            font-size: 12.5px;
            font-weight: 800;
            color: #fde047;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Bộ nút điều khiển */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 7px;
            width: 100%;
            max-width: 380px;
        }

        .btn {
            border: none;
            padding: 8px 6px;
            border-radius: 11px;
            font-size: 12.5px;
            font-weight: 800;
            cursor: pointer;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .btn:active { transform: translateY(2px); }

        .btn-undo { background: linear-gradient(180deg, #475569, #334155); border-bottom: 3px solid #1e293b; }
        .btn-clear { background: linear-gradient(180deg, #ef4444, #b91c1c); border-bottom: 3px solid #7f1d1d; }
        .btn-hint { background: linear-gradient(180deg, #f59e0b, #b45309); border-bottom: 3px solid #78350f; }
        .btn-hint.active { background: linear-gradient(180deg, #10b981, #047857); border-bottom: 3px solid #064e3b; }

        .btn-cast {
            grid-column: 1 / -1;
            background: linear-gradient(180deg, #a855f7 0%, #7c3aed 100%);
            border-bottom: 4px solid #4c1d95;
            padding: 11px 18px;
            font-size: 15.5px;
            letter-spacing: 0.5px;
            box-shadow: 0 5px 16px rgba(139, 92, 246, 0.5);
        }
        .btn-cast:active {
            transform: translateY(3px);
            border-bottom-width: 1px;
        }

        @media (max-height: 700px) {
            .battle-field { height: 132px; padding: 6px 14px 4px 14px; }
            .svg-char { width: 66px; height: 72px; }
            .canvas-container { width: 185px; height: 185px; }
            .ghost-kanji { font-size: 134px; }
        }
    </style>
</head>
<body>

<div class="game-container">
    <div class="top-nav">
        <a href="index.html" onclick="goPage('index.html'); return false;" class="btn-back">← Menu</a>
        <div class="level-select-wrap">
            <select class="level-select" id="level-select" onchange="changeLevel()" title="Chọn bài Kanji"></select>
        </div>
        <button class="btn-sound" id="btn-sound" onclick="toggleSound()" title="Bật/Tắt âm thanh">🔊</button>
    </div>

    <div class="status-bar">
        <div class="stat-pill">💀 Diệt: <span id="kills" style="color:#d8b4fe;">0</span></div>
        <div class="stat-pill">🏆 Kỷ lục: <span id="high-score" style="color:#fbbf24;">0</span></div>
    </div>

    <div class="battle-field" id="arena">
        <div class="arcane-moon"></div>
        <div class="stone-stripes"></div>

        <div class="character-box">
            <div class="wizard-wrap" id="wizard-wrap">
                <svg class="svg-char" viewBox="0 0 100 100">
                    <path d="M 50 65 Q 38 78 20 88 Q 45 83 50 65 Z" fill="#15803d" stroke="#052e16" stroke-width="1.5"/>
                    <path d="M 50 65 Q 62 78 80 88 Q 55 83 50 65 Z" fill="#15803d" stroke="#052e16" stroke-width="1.5"/>
                    <path d="M 46 48 C 45 63 55 78 50 92" stroke="#16a34a" stroke-width="8" fill="none" stroke-linecap="round"/>
                    <circle cx="40" cy="42" r="21" fill="#22c55e" stroke="#052e16" stroke-width="2"/>
                    <ellipse cx="59" cy="42" rx="11" ry="14" fill="#16a34a" stroke="#052e16" stroke-width="2"/>
                    <ellipse cx="61" cy="42" rx="6" ry="9" fill="#052e16"/>
                    <circle cx="36" cy="35" r="4.5" fill="#090d16"/>
                    <circle cx="37.5" cy="33.5" r="1.8" fill="#fff"/>
                    <polygon points="20,25 60,25 38,2" fill="#7c3aed" stroke="#3b0764" stroke-width="1.5"/>
                    <polygon points="36,12 41,12 38.5,16" fill="#fbbf24"/>
                    <ellipse cx="40" cy="25" rx="26" ry="5" fill="#6d28d9" stroke="#3b0764" stroke-width="1.5"/>
                </svg>
            </div>
        </div>

        <div class="character-box zombie-box" id="zombie-box">
            <div class="zombie-tag" id="zombie-rank">ZOMBIE PHÉP</div>
            <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp-bar"></div></div>
            <div class="zombie-svg-wrap">
                <svg class="svg-char" viewBox="0 0 100 100">
                    <rect x="35" y="45" width="30" height="35" fill="#1e3a8a" rx="4" stroke="#0f172a" stroke-width="1.5"/>
                    <polygon points="48,47 52,47 53,63 50,67 47,63" fill="#a855f7"/>
                    <rect x="38" y="78" width="10" height="20" fill="#451a03"/>
                    <rect x="52" y="78" width="10" height="20" fill="#451a03"/>
                    <path d="M 35 50 L 15 52 L 10 58" stroke="#6b7280" stroke-width="6" stroke-linecap="round" fill="none"/>
                    <rect x="30" y="15" width="40" height="32" fill="#6b7280" rx="8" stroke="#1f2937" stroke-width="1.5"/>
                    <g id="zombie-armor-cone" style="display:none;">
                        <polygon points="34,17 50,0 66,17" fill="#f97316" stroke="#7c2d12" stroke-width="1.5"/>
                        <rect x="31" y="14" width="38" height="4" rx="2" fill="#ea580c"/>
                    </g>
                    <g id="zombie-armor-bucket" style="display:none;">
                        <path d="M 33 17 L 37 2 L 63 2 L 67 17 Z" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
                        <line x1="34" y1="8" x2="66" y2="8" stroke="#475569" stroke-width="2"/>
                    </g>
                    <circle cx="42" cy="26" r="6" fill="#fff" stroke="#000" stroke-width="1"/>
                    <circle cx="41" cy="26" r="2" fill="#000"/>
                    <circle cx="58" cy="28" r="8" fill="#fff" stroke="#000" stroke-width="1"/>
                    <circle cx="56" cy="28" r="2.5" fill="#ef4444"/>
                    <path d="M 40 38 Q 50 44 60 38" stroke="#111827" stroke-width="2.2" fill="none"/>
                </svg>
            </div>
        </div>
    </div>

    <div class="prompt-box">
        <div class="combo-badge" id="combo-badge">🔥 COMBO x2</div>
        <div class="reading-text" id="reading-display">-</div>
        <div class="meaning-text" id="meaning-display">-</div>
        <div class="progress-text" id="progress-display">Tiến độ: 0/0</div>
    </div>

    <div class="pad-wrapper">
        <div class="canvas-container" id="canvas-container">
            <div class="canvas-grid"></div>
            <div class="talisman-corner tc-tl"></div>
            <div class="talisman-corner tc-tr"></div>
            <div class="talisman-corner tc-bl"></div>
            <div class="talisman-corner tc-br"></div>
            <div class="ghost-kanji" id="ghost-kanji">一</div>
            <canvas id="draw-canvas" width="240" height="240"></canvas>
        </div>

        <div class="feedback-msg" id="feedback-msg">Vẽ chữ Kanji tương ứng vào lá bùa trên!</div>

        <div class="controls">
            <button class="btn btn-undo" onclick="undoStroke()">↩️ Hoàn tác</button>
            <button class="btn btn-clear" onclick="clearCanvas()">🗑️ Xóa hết</button>
            <button class="btn btn-hint" id="btn-hint" onclick="toggleHint()">👁️ Nét mờ</button>
            <button class="btn btn-cast" onclick="checkKanji()">⚡ TUNG CHIÊU PHÉP</button>
        </div>
    </div>
</div>

<canvas id="target-canvas" width="240" height="240" style="display:none;"></canvas>

<script>
    function goPage(url) {
        window.location.href = url;
    }

    const n5KanjiWriteData = {
        1: [
            { kanji: '一', hira: 'いち', romaji: 'ichi', mean: 'Số 1 (Nhất)' },
            { kanji: '二', hira: 'に', romaji: 'ni', mean: 'Số 2 (Nhị)' },
            { kanji: '三', hira: 'さん', romaji: 'san', mean: 'Số 3 (Tam)' },
            { kanji: '四', hira: 'よん', romaji: 'yon', mean: 'Số 4 (Tứ)' },
            { kanji: '五', hira: 'ご', romaji: 'go', mean: 'Số 5 (Ngũ)' },
            { kanji: '六', hira: 'ろく', romaji: 'roku', mean: 'Số 6 (Lục)' },
            { kanji: '七', hira: 'なな', romaji: 'nana', mean: 'Số 7 (Thất)' },
            { kanji: '八', hira: 'はち', romaji: 'hachi', mean: 'Số 8 (Bát)' },
            { kanji: '九', hira: 'きゅう', romaji: 'kyuu', mean: 'Số 9 (Cửu)' },
            { kanji: '十', hira: 'じゅう', romaji: 'juu', mean: 'Số 10 (Thập)' }
        ],
        2: [
            { kanji: '百', hira: 'ひゃく', romaji: 'hyaku', mean: 'Trăm (Bách)' },
            { kanji: '千', hira: 'せん', romaji: 'sen', mean: 'Nghìn (Thiên)' },

    function getPos(e) {
        const rect = drawCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const scaleX = drawCanvas.width / rect.width;
        const scaleY = drawCanvas.height / rect.height;
        return {
            x: (clientX - rect.left) * scaleX,
            y: (clientY - rect.top) * scaleY
        };
    }

    function startDraw(e) {
        if (isCasting) return;
        strokeHistory.push(ctx.getImageData(0, 0, drawCanvas.width, drawCanvas.height));
        if (strokeHistory.length > 25) strokeHistory.shift();

        isDrawing = true;
        hasDrawn = true;
        const pos = getPos(e);
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
        e.preventDefault();
    }

    function moveDraw(e) {
        if (!isDrawing || isCasting) return;
        const pos = getPos(e);
        ctx.lineWidth = 10;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#111827';
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        e.preventDefault();
    }

    function endDraw() { isDrawing = false; }

    drawCanvas.addEventListener('mousedown', startDraw);
    drawCanvas.addEventListener('mousemove', moveDraw);
    window.addEventListener('mouseup', endDraw);

    drawCanvas.addEventListener('touchstart', startDraw, { passive: false });
    drawCanvas.addEventListener('touchmove', moveDraw, { passive: false });
    window.addEventListener('touchend', endDraw);

    let audioCtx = null;
    function toggleSound() {
        soundEnabled = !soundEnabled;
        document.getElementById('btn-sound').innerText = soundEnabled ? '🔊' : '🔇';
    }

    function playSound(type) {
        if (!soundEnabled) return;
        try {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'cast') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.25);
                gain.gain.setValueAtTime(0.24, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } else if (type === 'hit') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(145, now);
                osc.frequency.linearRampToValueAtTime(45, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            } else if (type === 'fail') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                osc.frequency.linearRampToValueAtTime(95, now + 0.2);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            }
        } catch (e) {}
    }

    function undoStroke() {
        if (isCasting || strokeHistory.length === 0) return;
        ctx.putImageData(strokeHistory.pop(), 0, 0);
        if (strokeHistory.length === 0) hasDrawn = false;

    function clearCanvas() {
        ctx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);

    function nextQuestion() {
        if (qIndex >= queue.length) {
            setFeedback("🎉 Xong vòng! Tự động trộn lại bài...", "#4ade80");
            queue = queue.sort(() => Math.random() - 0.5);
            qIndex = 0;

        currentQ = queue[qIndex];
        document.getElementById('reading-display').innerText = `${currentQ.hira} (${currentQ.romaji})`;
        document.getElementById('meaning-display').innerText = `Nghĩa: ${currentQ.mean}`;
        document.getElementById('progress-display').innerText = `Tiến độ: ${qIndex + 1} / ${queue.length}`;

        const ghost = document.getElementById('ghost-kanji');
        ghost.innerText = currentQ.kanji;
        ghost.style.display = 'none';
        document.getElementById('btn-hint').classList.remove('active');
        hintUsed = false;

        targetCtx.font = 'bold 160px "Hiragino Kaku Gothic Pro", "Yu Gothic", "Meiryo", sans-serif';
        targetCtx.textAlign = 'center';
        targetCtx.textBaseline = 'middle';
        targetCtx.lineWidth = 60;
        targetCtx.strokeStyle = '#000';
        targetCtx.strokeText(currentQ.kanji, 120, 125);
        targetCtx.fillStyle = '#000';
        targetCtx.fillText(currentQ.kanji, 120, 125);

        clearCanvas();
        isCasting = false;
    }

    function triggerPadError(msg) {
        setFeedback(msg, "#f87171");
        const container = document.getElementById('canvas-container');
        container.classList.remove('shake');
        void container.offsetWidth;
        container.classList.add('shake');
        setTimeout(() => container.classList.remove('shake'), 350);
    }

    function checkKanji() {
        if (isCasting || !currentQ) return;
        if (!hasDrawn) {
            triggerPadError("⚠️ Ông chưa vẽ nét nào lên lá bùa kìa!");
            return;
        }

        const userData = ctx.getImageData(0, 0, 240, 240).data;
        const targetData = targetCtx.getImageData(0, 0, 240, 240).data;

        let targetPixels = 0;
        let matchedPixels = 0;
        let userTotalPixels = 0;

        for (let i = 3; i < targetData.length; i += 4) {
            if (targetData[i] > 50) targetPixels++;
            if (userData[i] > 50) {
                userTotalPixels++;
                if (targetData[i] > 50) matchedPixels++;
            }
        }

        if (userTotalPixels < 30) {
            triggerPadError("⚠️ Viết ngắn quá! Vẽ rõ nét hơn chút nhé.");
            return;
        }
        if (userTotalPixels > 9000) {
            triggerPadError("⚠️ Viết gọn tay lại chút nhé ông tướng!");
            return;
        }

        const coverage = matchedPixels / Math.max(1, targetPixels);

        if (coverage >= 0.12) {
            isCasting = true;
            combo++;
            if (combo > 1) {
                const cb = document.getElementById('combo-badge');
                cb.innerText = `🔥 COMBO x${combo}`;
                cb.style.display = 'block';
            }
            setFeedback(`✨ CHÍNH XÁC! Phóng bùa "${currentQ.kanji}"!`, "#4ade80");
            castSpell(currentQ.kanji);
        } else {
            combo = 0;
            document.getElementById('combo-badge').style.display = 'none';
            playSound('fail');
            triggerPadError(`❌ Chưa đúng chữ "${currentQ.kanji}" lắm! Thử viết lại xem.`);
        }
    }

    function castSpell(kanjiChar) {
        playSound('cast');
        const wizWrap = document.getElementById('wizard-wrap');
        wizWrap.classList.remove('cast');
        void wizWrap.offsetWidth;
        wizWrap.classList.add('cast');

        const arena = document.getElementById('arena');
        const spell = document.createElement('div');
        spell.className = 'spell-shot';
        spell.innerText = kanjiChar;
        arena.appendChild(spell);

        const startX = 82;
        const targetX = Math.max(185, arena.offsetWidth - 94);
        const duration = 260;
        const startTime = performance.now();

        function animateSpell(now) {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            spell.style.left = (startX + (targetX - startX) * progress) + 'px';

            if (progress < 1) {
                requestAnimationFrame(animateSpell);
            } else {
                spell.remove();
                spawnArcaneParticles(targetX + 12);
                damageZombie();
                qIndex++;
                nextQuestion();
            }
        }
        requestAnimationFrame(animateSpell);
    }

    function spawnArcaneParticles(hitX) {
        const arena = document.getElementById('arena');
        const colors = ['#e879f9', '#c084fc', '#fde047', '#38bdf8'];
        for (let i = 0; i < 10; i++) {
            const p = document.createElement('div');
            p.className = 'arcane-particle';
            const col = colors[i % colors.length];
            p.style.background = col;
            p.style.boxShadow = `0 0 8px ${col}`;
            p.style.left = hitX + 'px';
            p.style.bottom = '46px';
            const angle = (Math.PI * 2 * i) / 10;
            const dist = 22 + Math.random() * 24;
            p.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
            p.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
            arena.appendChild(p);
            setTimeout(() => p.remove(), 460);
        }
    }

        } else {
            cone.style.display = 'none';
            bucket.style.display = 'none';
            rank.innerText = 'ZOMBIE PHÉP';
            rank.style.background = 'rgba(107, 33, 168, 0.92)';
        }
    }

    function damageZombie() {
        playSound('hit');
        const baseDmg = hintUsed ? 35 : 50;
        const dmg = baseDmg + Math.min(combo * 5, 25);
        zombieHP -= dmg;

        showFloatingDamage(dmg);

        const zBox = document.getElementById('zombie-box');
        zBox.classList.add('hit');
        setTimeout(() => zBox.classList.remove('hit'), 160);

        if (zombieHP <= 0) {
            kills++;
            document.getElementById('kills').innerText = kills;
            if (kills > highScore) {
                highScore = kills;
                localStorage.setItem('kanji_write_best', highScore);
                document.getElementById('high-score').innerText = highScore;
            }
            zombieHP = 100;
            updateZombieAppearance();
        }

        document.getElementById('hp-bar').style.width = Math.max(0, zombieHP) + '%';
    }

    window.onload = function () { changeLevel(); };
</script>

</body>
</html>
